<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Store - Lab 2</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="styles.css" rel="stylesheet">
  </head>
  <body>
    <header>
      <nav class="navbar navbar-expand-md navbar-dark">
        <div class="container">
          <a class="navbar-brand logo" href="index.html">Game Store</a>
          <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu" aria-controls="menu" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse menu" id="menu">
            <div class="navbar-nav">
              <a class="nav-link" href="index.html">Home</a>
              <a class="nav-link" href="#games">Games</a>
              <a class="nav-link" href="#contact">Contact</a>
            </div>
          </div>
          <span class="cart">&#128722; 0</span>
        </div>
      </nav>
    </header>

    <main class="container" id="games">
      <h1>Popular games</h1>
      <div class="row g-4">
        <div class="col-12 col-md-6 col-lg-3">
          <article class="game">
            <img src="images/cyberpunk.webp" alt="Cyberpunk 2077 Ultimate Edition">
            <div class="info">
              <h2>Cyberpunk 2077</h2>
              <p>$31.99</p>
              <button class="btn shop-btn" type="button">Add to Cart</button>
            </div>
          </article>
        </div>
        <div class="col-12 col-md-6 col-lg-3">
          <article class="game">
            <img src="images/ghostwire.webp" alt="Ghostwire: Tokyo">
            <div class="info">
              <h2>Ghostwire: Tokyo</h2>
              <p>$14.99</p>
              <button class="btn shop-btn" type="button">Add to Cart</button>
            </div>
          </article>
        </div>
        <div class="col-12 col-md-6 col-lg-3">
          <article class="game">
            <img src="images/oblivion.webp" alt="The Elder Scrolls IV: Oblivion">
            <div class="info">
              <h2>Oblivion</h2>
              <p>$4.99</p>
              <button class="btn shop-btn" type="button">Add to Cart</button>
            </div>
          </article>
        </div>
        <div class="col-12 col-md-6 col-lg-3">
          <article class="game">
            <img src="images/octopath.webp" alt="Octopath Traveler">
            <div class="info">
              <h2>Octopath Traveler</h2>
              <p>$59.99</p>
              <button class="btn shop-btn" type="button">Add to Cart</button>
            </div>
          </article>
        </div>
      </div>
    </main>

    <footer class="container" id="contact">
      <p><a href="mailto:azeemswr.as@gmail.com">Contact us</a></p>
      <p>&copy; 2026 Azeem Sarwar</p>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
